name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main", "dev-cicd" ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECS_TASK_DEFINITION: alert-triage-gateway-stack.json
  CONTAINER_NAME: app

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set Branch-Specific Deployment Variables
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "ECR_REPOSITORY=alert-triage-gateway/backend-prod" >> $GITHUB_ENV
          echo "ECS_SERVICE=alert-triage-gateway-service-prod" >> $GITHUB_ENV
          echo "ECS_CLUSTER=alert-triage-gateway-cluster-prod" >> $GITHUB_ENV
        else
          echo "ECR_REPOSITORY=alert-triage-gateway/backend-dev" >> $GITHUB_ENV
          echo "ECS_SERVICE=alert-triage-gateway-service-dev" >> $GITHUB_ENV
          echo "ECS_CLUSTER=alert-triage-gateway-cluster-dev" >> $GITHUB_ENV
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
