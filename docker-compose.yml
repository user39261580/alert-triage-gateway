services:
  postgres:
    image: postgres:15.14-alpine
    container_name: infra_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alert-triage-gateway
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hyperdx:4318
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      hyperdx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  hyperdx:
    image: hyperdx/hyperdx-all-in-one:2.0.1
    container_name: infra_hyperdx
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    environment:
      __HDX_API_KEY: ${HDX_API_KEY}
      HYPERDX_API_KEY: ${HDX_API_KEY}
      OTEL_EXPORTER_OTLP_HEADERS: authorization=${HDX_API_KEY}
    volumes:
      - hyperdx_mongo_data:/data/db
      - hyperdx_clickhouse_data:/var/lib/clickhouse

volumes:
  postgres_data:
  hyperdx_mongo_data:
  hyperdx_clickhouse_data:
