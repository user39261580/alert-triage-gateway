services:
  postgres:
    image: postgres:15.14-alpine
    container_name: infra_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d infra_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  hyperdx:
    image: hyperdx/hyperdx-all-in-one:2.0.1
    container_name: infra_hyperdx
    ports:
      - "8080:8080"
      - "4317:4317"
      - "4318:4318"
    environment:
      __HDX_API_KEY: ${HDX_API_KEY}

  langfuse:
    image: langfuse/langfuse:2
    container_name: infra_langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=${LANGFUSE_DB_SCHEMA}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
