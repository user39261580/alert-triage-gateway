[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-triage-gateway"
version = "0.1.0"
description = "Alert Triage Gateway with LLM evaluation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Alert Triage Team" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "langfuse>=3.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-psycopg2",
    "pydantic",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
required-version = "3.14"
